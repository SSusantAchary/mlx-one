name: Feature request
description: Propose an outcome aligned with the mlx-one roadmap.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What workflow is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: modality
    attributes:
      label: Modality
      options: [Text, Vision-language, ASR, TTS, Model merging, Shipping, Other]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: References or validation evidence
