name: Bug report
description: Report reproducible incorrect behavior in mlx-one.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Run `mlx-one doctor --json-output` and remove private paths before posting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest commands or code that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor report
      render: json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
