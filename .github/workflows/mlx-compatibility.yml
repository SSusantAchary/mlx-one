name: MLX compatibility window

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  native-smoke:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mlx-version: ["0.32.2", "0.32.1", "0.32.0", "0.31.2", "0.31.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact MLX release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "mlx==${{ matrix.mlx-version }}"
      - name: Confirm runner and runtime
        run: |
          uname -m
          python -c "import mlx; print(mlx.__version__)"
      - name: Run backend-free contracts
        run: pytest tests/test_mlx_compatibility.py tests/test_native_llama_architecture.py
      - name: Run lightweight native MLX qualification
        env:
          MLX_ONE_RUN_MLX_TESTS: "1"
        run: |
          pytest \
            tests/test_native_gpt2_mlx.py \
            tests/test_native_lfm_mlx.py \
            tests/test_native_llama_mlx.py \
            tests/test_native_openelm_mlx.py \
            tests/test_native_qwen_mlx.py \
            tests/test_native_qwen_multimodal_mlx.py \
            tests/test_native_qwen3_retrieval_mlx.py \
            tests/test_native_sentence_transformers_mlx.py \
            tests/test_native_tuning_mlx.py \
            tests/test_native_whisper_mlx.py
