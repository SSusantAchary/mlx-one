name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - README.md
      - status_models_testing.md
      - CITATION.bib
      - LICENSE
      - CHANGELOG.md
      - mlx_One_chat_ui.png
      - ui/static/mlx-one-logo.png
      - src/mlx_one/models/**/README.md
      - src/mlx_one/data/**
      - benchmarks/audio/checkpoints.json
      - src/mlx_one/models/registry.py
      - src/mlx_one/core/registry.py
      - src/mlx_one/ocr/registry.py
      - .github/workflows/docs-site.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - README.md
      - status_models_testing.md
      - CITATION.bib
      - LICENSE
      - CHANGELOG.md
      - mlx_One_chat_ui.png
      - ui/static/mlx-one-logo.png
      - src/mlx_one/models/**/README.md
      - src/mlx_one/data/**
      - benchmarks/audio/checkpoints.json
      - src/mlx_one/models/registry.py
      - src/mlx_one/core/registry.py
      - src/mlx_one/ocr/registry.py
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install documentation tools
        run: python -m pip install -r website/requirements.txt
      - name: Build and verify the documentation
        run: |
          python -m unittest discover -s website/tests -v
          python website/build.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
