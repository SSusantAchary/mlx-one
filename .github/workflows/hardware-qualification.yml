name: Apple Silicon qualification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Qualification target
        required: true
        type: choice
        options:
          - full
          - qwen2.5-0.5b-native-training
          - minicpm5-1b
          - minicpm5-2b
          - qwen2-vl-2b
          - whisper-tiny
          - retrieval

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, mlx-one-hardware]
    timeout-minutes: 180
    concurrency:
      group: mlx-one-m4-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qualification environment
        run: python -m pip install -e ".[dev]"
      - name: Verify reference hardware
        run: mlx-one doctor --json-output
      - name: Run pinned native qualification target
        env:
          TARGET: ${{ inputs.target }}
          MLX_ONE_RUN_MINICPM5_INTEGRATION: "1"
          MLX_ONE_RUN_WHISPER_INTEGRATION: "1"
        run: python scripts/qualify_native_target.py "$TARGET" --output qualification-report.json
      - name: Upload sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}-qualification
          path: |
            qualification-report.json
            runs/qualification/${{ inputs.target }}/workflow.json
            runs/qualification/${{ inputs.target }}/report.md
            runs/qualification/${{ inputs.target }}/runs/*/result.json
            runs/qualification/${{ inputs.target }}/training/runs/*/result.json
            runs/qualification/${{ inputs.target }}/exported-adapter/smoke-test.json
          if-no-files-found: warn
