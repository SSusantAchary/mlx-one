name: Model performance evidence
on:
  pull_request:
    paths:
      - README.md
      - docs/benchmarks/**
      - benchmarks/model_performance/**
      - src/mlx_one/data/compatibility/alpha_release.json
      - tests/unit/test_model_performance_reporting.py
      - .github/workflows/model-performance.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python benchmarks/model_performance/report.py --check
      - run: python -m unittest discover -s tests/unit -p test_model_performance_reporting.py
