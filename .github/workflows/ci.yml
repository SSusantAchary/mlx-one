name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create isolated test environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
          python -m pip install -e ".[dev]" "mlx==0.32.2"

      - name: Ruff lint with explicit inherited debt
        run: python scripts/release/check_lint.py

      - name: Verify test environment
        run: |
          python -c 'import sys; print(sys.executable); print(sys.version)'
          python -m pytest --version
          python -m pip check

      - name: Pytest
        run: python -m pytest --junitxml=test-results/pytest.xml

      - name: Preserve pytest report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: test-results/pytest.xml
          if-no-files-found: ignore

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

  clean-wheel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/mlx-one-wheel-test
          /tmp/mlx-one-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/mlx-one-wheel-test/bin/mlx-one --version
          /tmp/mlx-one-wheel-test/bin/mlx-one registry list > /tmp/registry.json
          /tmp/mlx-one-wheel-test/bin/python -c 'import json; json.load(open("/tmp/registry.json"))'
