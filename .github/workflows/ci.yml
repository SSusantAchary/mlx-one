name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

  clean-wheel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/mlx-one-wheel-test
          /tmp/mlx-one-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/mlx-one-wheel-test/bin/mlx-one --version
          /tmp/mlx-one-wheel-test/bin/mlx-one registry list > /tmp/registry.json
          /tmp/mlx-one-wheel-test/bin/python -c 'import json; json.load(open("/tmp/registry.json"))'
