[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-one"
version = "0.1.0a1"
description = "Model-size-agnostic lifecycle tooling for MLX on Apple Silicon."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "S Susant Achary" }
]
keywords = [
    "mlx",
    "apple-silicon",
    "llm",
    "vlm",
    "audio",
    "training",
    "conversion",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx==0.32.2",
    "mlx-metal==0.32.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "numpy>=1.26,<3",
    "click>=8.0",
    "certifi>=2026.10.19",
    "tokenizers>=0.20,<1",
    "jinja2>=3.1,<4",
    "tqdm>=4.70.0",
    "safetensors>=0.8.0",
    "pyyaml>=6.0.3",
    "regex>=2026.9.3",
    "huggingface-hub>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/SSusantAchary/mlx-one"
Repository = "https://github.com/SSusantAchary/mlx-one"
Issues = "https://github.com/SSusantAchary/mlx-one/issues"
Changelog = "https://github.com/SSusantAchary/mlx-one/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tracking = ["mlflow"]
wandb = ["wandb"]
viz = ["matplotlib"]
legacy-mlx-lm = ["mlx-lm>=0.31,<1"]
server = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.13.5,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]
vision = ["pillow>=10,<13"]
ocr = ["pillow>=10,<13", "pypdfium2>=4.30,<6", "tiktoken>=0.9,<1"]
ocr-bench = ["rapidfuzz>=3,<4", "pyarrow>=20,<24"]
audio = []  # Native MLX/NumPy/tokenizers are core; encoded media additionally requires FFmpeg.
qwen-align-ja = ["nagisa==0.2.11"]
qwen-align-ko = ["soynlp==0.0.493"]  # Also requires the pinned checkpoint dictionary.
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.13.5,<3",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pillow>=10,<13",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
mlx-one = "mlx_one.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlx_one = [
    "models/UPSTREAM_LICENSE",
    "models/vision_language/UPSTREAM_LICENSE",
    "models/vision_language/UPSTREAM.md",
    "models/ocr/UPSTREAM_LICENSE",
    "models/ocr/UPSTREAM.md",
    "models/ocr/provenance.json",
    "quantization/turboquant/LICENSE.txt",
    "quantization/turboquant/NOTICE.txt",
    "data/*.json",
    "data/hardware/*.yaml",
    "data/calibrations/*.yaml",
    "data/calibrations/*.json",
    "data/compatibility/*.json",
    "models/language/qwen3/UPSTREAM_LICENSE",
    "models/language/gemma3/UPSTREAM_LICENSE",
    "models/language/phi3/UPSTREAM_LICENSE",
    "models/segmentation/sam3/NOTICE.md",
    "models/audio/lfm2_audio/UPSTREAM_LICENSE",
    "models/audio/lfm2_audio/UPSTREAM.md",
    "models/audio/parakeet/NOTICE",
    "models/audio/moonshine/NOTICE",
    "models/audio/qwen3_asr/NOTICE",
    "ui/dist/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=mlx_one --cov-report=term-missing"
